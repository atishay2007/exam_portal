{% extends "base.html" %}
{% block title %}Password Recovery - VIT Portal{% endblock %}
{% block content %}
<div class="card">
  <h3>Reset Your Password</h3>
  <form method="post">
    <div class="form-row">
      <input class="input" name="username" placeholder="Your Username" required>
    </div>
    <div class="form-row">
      <input class="input" name="new_password" type="password" placeholder="New Password" required>
    </div>
    <button class="btn" type="submit">Reset Password</button>
  </form>
  <p class="small" style="margin-top:10px">Return to <a href="{{ url_for('login') }}">Login</a></p>
</div>
{% endblock %}
