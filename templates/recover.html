{% extends "base.html" %}
{% block title %}Password Recovery - VIT Portal{% endblock %}
{% block content %}

<div class="reset-wrapper">
  <div class="reset-card">
    <h1>Reset Your Password</h1>
    <p class="subtitle">Enter your username and set a new password</p>

    <form method="post" class="reset-form">
      <input class="input full" name="username" placeholder="Your Username" required>
      <input class="input full" name="new_password" type="password" placeholder="New Password" required>

      <button class="btn-submit" type="submit">Reset Password</button>
    </form>

    <p class="small-text">
      Return to <a href="{{ url_for('login') }}">Login</a>
    </p>
  </div>
</div>

<style>
  /* ===== Page Layout (Navbar unaffected) ===== */
  .reset-wrapper {
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 80px 20px 100px 20px;
    background: transparent;
  }

  /* ===== Glass Card ===== */
  .reset-card {
    position: relative;
    width: 650px;
    background: rgba(17, 25, 40, 0.55);
    border: 1px solid rgba(255, 255, 255, 0.12);
    border-radius: 25px;
    padding: 60px 70px;
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    box-shadow: 0 10px 40px rgba(0, 255, 255, 0.12);
    text-align: center;
    transition: all 0.3s ease;
  }

  /* Glowing animated border */
  .reset-card::before {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: 25px;
    padding: 2px;
    background: linear-gradient(120deg, #00eaff, #3b82f6, #00eaff);
    background-size: 200% 200%;
    -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;
    animation: glowBorder 6s linear infinite;
    pointer-events: none; /* ✅ so inputs are clickable */
  }

  @keyframes glowBorder {
    0% { background-position: 0% 50%; }
    100% { background-position: 100% 50%; }
  }

  .reset-card h1 {
    font-size: 2.3rem;
    color: #00eaff;
    text-shadow: 0 0 25px rgba(0, 234, 255, 0.6);
    margin-bottom: 10px;
  }

  .subtitle {
    font-size: 1rem;
    color: #a1a1aa;
    margin-bottom: 40px;
  }

  /* ===== Form ===== */
  .reset-form {
    display: flex;
    flex-direction: column;
    gap: 22px;
  }

  .input {
    flex: 1;
    padding: 12px 16px;
    border-radius: 10px;
    border: 1px solid rgba(255, 255, 255, 0.12);
    background: rgba(255, 255, 255, 0.08);
    color: #e2e8f0;
    font-size: 1rem;
    transition: border-color 0.3s, background 0.3s;
  }

  .input.full {
    width: 100%;
  }

  .input:focus {
    border-color: #00eaff;
    background: rgba(255, 255, 255, 0.12);
    box-shadow: 0 0 15px rgba(0, 234, 255, 0.3);
    outline: none;
  }

  /* ===== Button ===== */
  .btn-submit {
    margin-top: 25px;
    background: linear-gradient(90deg, #00eaff, #3b82f6);
    border: none;
    color: #000;
    padding: 14px 0;
    border-radius: 10px;
    font-weight: 600;
    font-size: 1rem;
    cursor: pointer;
    transition: all 0.3s ease;
    letter-spacing: 0.5px;
  }

  .btn-submit:hover {
    background: linear-gradient(90deg, #00b4d8, #2563eb);
    color: #fff;
    box-shadow: 0 0 25px rgba(0, 234, 255, 0.3);
    transform: translateY(-2px);
  }

  /* ===== Footer Text ===== */
  .small-text {
    margin-top: 25px;
    font-size: 0.9rem;
    color: #a1a1aa;
  }

  .small-text a {
    color: #00eaff;
    text-decoration: none;
    font-weight: 600;
  }

  .small-text a:hover {
    text-decoration: underline;
  }

  /* ===== Responsive ===== */
  @media (max-width: 900px) {
    .reset-card {
      width: 90%;
      padding: 50px 30px;
    }
  }
</style>

{% endblock %}
