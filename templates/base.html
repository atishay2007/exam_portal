<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{% block title %}VIT Exam Portal{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <script src="{{ url_for('static', filename='js/theme.js') }}"></script>
  <script src="{{ url_for('static', filename='js/quiz.js') }}"></script>
</head>
<body>

  <!-- Navbar -->
  <nav style="display:flex;justify-content:space-between;align-items:center;padding:10px 20px;background:#007bff;color:white">
    <div style="display:flex;align-items:center;gap:10px">
      <img src="{{ url_for('static', filename='img/logo.png') }}" alt="Logo" style="height:28px">
      <strong>VIT Exam Portal</strong>
    </div>
    <div style="display:flex;gap:20px">
      <a href="{{ url_for('home') }}" style="color:white;text-decoration:none">Home</a>
      <a href="{{ url_for('signup') }}" style="color:white;text-decoration:none">Student</a>
      <a href="{{ url_for('admin_login') }}" style="color:white;text-decoration:none">Faculty</a>
      <a href="{{ url_for('profile') }}" style="color:white;text-decoration:none">Profile</a>
    </div>
  </nav>

  <!-- Main container -->
  <div class="container" style="padding:20px">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for cat, msg in messages %}
          <div class="card small">{{ msg }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    {% block content %}{% endblock %}

    <!-- Footer -->
    <footer style="text-align:center;padding:20px 0;font-size:0.9rem;color:#888">
      Made by Team Aloo Bhujia • Simple exam portal for demo
    </footer>
  </div>

</body>
</html>
