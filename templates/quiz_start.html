{% extends "base.html" %}
{% block content %}
<div class="card">
  <h3>Start Quiz</h3>
  <form method="post">
    <div class="form-row">
      <label class="small">Difficulty</label>
      <select name="difficulty" class="input">
        <option value="any">Any</option>
        {% for d in difficulties %}<option value="{{ d }}">{{ d }}</option>{% endfor %}
      </select>
    </div>
    <div class="form-row">
      <label class="small">Number of Questions</label>
      <input class="input" name="count" type="number" min="1" max="20" value="5">
    </div>
    <div class="form-row">
      <label class="small">Seconds per Question</label>
      <input class="input" name="per_q" type="number" min="10" max="300" value="30">
    </div>
    <button class="btn" type="submit">Start</button>
  </form>
</div>
{% endblock %}
