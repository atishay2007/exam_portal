{% extends "base.html" %}
{% block content %}
<div class="card">
  <div style="display:flex;justify-content:space-between;align-items:center">
    <div>Question {{ idx+1 }} / {{ total }}</div>
    <div class="small">Time left: <span id="timeLeft">{{ per_q }}</span>s</div>
  </div>
  <div class="progress" style="margin-top:10px">
    <div id="progBar" style="width:{{ progress }}%;height:6px;background:#007bff;border-radius:4px"></div>
  </div>

  <h4 style="margin-top:14px">{{ q.question }}</h4>
  <form id="answerForm" method="post">
    {% for opt in q.options %}
      <div style="margin:8px 0">
        <label>
          <input type="radio" name="option" value="{{ opt }}" required> {{ opt }}
        </label>
      </div>
    {% endfor %}
    <div style="margin-top:12px;display:flex;gap:8px">
      <button class="btn" type="submit">Submit</button>
      <a class="btn" href="{{ url_for('quiz_start') }}" style="background:#6c757d">Cancel</a>
    </div>
  </form>
</div>

<script>
  document.addEventListener("DOMContentLoaded", function () {
    let timeLeft = {{ per_q }};
    const timeDisplay = document.getElementById("timeLeft");
    const form = document.getElementById("answerForm");

    const countdown = setInterval(() => {
      timeLeft--;
      timeDisplay.textContent = timeLeft;

      if (timeLeft <= 0) {
        clearInterval(countdown);

        // If no option selected, submit empty
        const selected = form.querySelector('input[name="option"]:checked');
        if (!selected) {
          const hidden = document.createElement("input");
          hidden.type = "hidden";
          hidden.name = "option";
          hidden.value = "";
          form.appendChild(hidden);
        }

        // Submit with default action
        const action = document.createElement("input");
        action.type = "hidden";
        action.name = "action";
        action.value = "next";
        form.appendChild(action);
        
        form.querySelectorAll("button").forEach(btn => btn.disabled = true);

        form.submit();
      }
    }, 1000);
  });
</script>

{% endblock %}
