{% extends "base.html" %}
{% block title %}Faculty Login - VIT Portal{% endblock %}
{% block content %}

<div class="auth-wrapper">
  <div class="auth-card">
    <h1>Faculty Login</h1>
    <p class="subtitle">Sign in with your faculty credentials</p>

    <form method="post" class="auth-form">
      <input class="input" name="username" placeholder="Admin Username" required>
      <input class="input" name="password" type="password" placeholder="Admin Password" required>

      <div class="button-row">
        <button class="btn-submit" type="submit">Login as Admin</button>
        <a class="btn-alt" href="{{ url_for('home') }}">Back</a>
      </div>
    </form>

    
  </div>
</div>

<style>
  /* ===== Layout ===== */
  .auth-wrapper {
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 80px 20px 100px 20px;
    background: transparent;
  }

  /* ===== Glass Card ===== */
  .auth-card {
    position: relative;
    width: 650px;
    background: rgba(17, 25, 40, 0.55);
    border: 1px solid rgba(255, 255, 255, 0.12);
    border-radius: 25px;
    padding: 60px 70px;
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    box-shadow: 0 10px 40px rgba(0, 255, 255, 0.12);
    text-align: center;
    transition: all 0.3s ease;
  }

  /* Glowing animated border */
  .auth-card::before {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: 25px;
    padding: 2px;
    background: linear-gradient(120deg, #00ffff, #007bff, #00ffff);
    background-size: 200% 200%;
    -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;
    animation: glowBorder 6s linear infinite;
    pointer-events: none; /* important for input interaction */
  }

  @keyframes glowBorder {
    0% { background-position: 0% 50%; }
    100% { background-position: 100% 50%; }
  }

  .auth-card h1 {
    font-size: 2.3rem;
    color: #00ffff;
    text-shadow: 0 0 25px rgba(0, 255, 255, 0.5);
    margin-bottom: 10px;
  }

  .subtitle {
    font-size: 1rem;
    color: #a1a1aa;
    margin-bottom: 40px;
  }

  /* ===== Form ===== */
  .auth-form {
    display: flex;
    flex-direction: column;
    gap: 22px;
  }

  .input {
    width: 100%;
    padding: 12px 16px;
    border-radius: 10px;
    border: 1px solid rgba(255, 255, 255, 0.12);
    background: rgba(255, 255, 255, 0.08);
    color: #e2e8f0;
    font-size: 1rem;
    transition: border-color 0.3s, background 0.3s;
  }

  .input:focus {
    border-color: #00ffff;
    background: rgba(255, 255, 255, 0.12);
    box-shadow: 0 0 15px rgba(0, 255, 255, 0.4);
    outline: none;
  }

  /* ===== Buttons ===== */
  .button-row {
    display: flex;
    justify-content: center;
    gap: 15px;
    margin-top: 10px;
  }

  .btn-submit {
    flex: 1;
    background: linear-gradient(90deg, #00ffff, #007bff);
    border: none;
    color: #000;
    padding: 14px 0;
    border-radius: 10px;
    font-weight: 600;
    font-size: 1rem;
    cursor: pointer;
    transition: all 0.3s ease;
    letter-spacing: 0.5px;
  }

  .btn-submit:hover {
    background: linear-gradient(90deg, #0099ff, #00e6e6);
    color: #fff;
    box-shadow: 0 0 25px rgba(0, 255, 255, 0.4);
    transform: translateY(-2px);
  }

  .btn-alt {
    flex: 1;
    background: rgba(255, 255, 255, 0.08);
    color: #e2e8f0;
    border: 1px solid rgba(255, 255, 255, 0.12);
    padding: 14px 0;
    border-radius: 10px;
    font-weight: 600;
    font-size: 1rem;
    text-decoration: none;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.3s ease;
  }

  .btn-alt:hover {
    background: rgba(255, 255, 255, 0.15);
    color: #00ffff;
    box-shadow: 0 0 20px rgba(0, 255, 255, 0.3);
  }

  /* ===== Footer Text ===== */
  .small-text {
    margin-top: 25px;
    font-size: 0.9rem;
    color: #a1a1aa;
  }

  /* ===== Responsive ===== */
  @media (max-width: 900px) {
    .auth-card {
      width: 90%;
      padding: 50px 30px;
    }
    .button-row {
      flex-direction: column;
    }
  }
</style>

{% endblock %}
